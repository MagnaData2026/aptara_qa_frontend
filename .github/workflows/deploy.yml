name: Deploy Aptara QA Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/aptara_qa_frontend
            git pull origin main
            npm ci
            npm run build
            sudo nginx -t
            sudo systemctl reload nginx
